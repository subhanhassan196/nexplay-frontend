<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline — NexPlay</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #09090B; color: #fff; text-align: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .card { max-width: 340px; }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px;
      background: linear-gradient(135deg, #7C3AED, #06B6D4);
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #a1a1aa; font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
    button {
      background: linear-gradient(135deg, #7C3AED, #06B6D4); color: #fff;
      border: 0; border-radius: 12px; padding: 12px 24px; font-size: 14px;
      font-weight: 500; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark"></div>
    <h1>You're offline</h1>
    <p>NexPlay needs a connection for live chat, tournaments and rankings. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
